<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'" />
  <title>Connection Point</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Tailwind v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Design tokens + global styles -->
  <style>
    :root {
      /* Backgrounds */
      --bg-base:       #f5f5f5;
      --bg-surface:    #ffffff;
      --bg-raised:     #f0f0f0;
      --bg-hover:      #e8e8e8;

      /* Text */
      --text-primary:   #111111;
      --text-secondary: #555555;
      --text-muted:     #999999;

      /* Borders */
      --border:         #d8d8d8;
      --border-subtle:  #ebebeb;

      /* Accent */
      --accent:         #6366f1;
      --accent-muted:   rgba(99, 102, 241, 0.1);

      /* Status */
      --success:        #059669;
      --success-muted:  rgba(5, 150, 105, 0.1);
      --warning:        #d97706;
      --warning-muted:  rgba(217, 119, 6, 0.1);
      --danger:         #dc2626;
      --danger-muted:   rgba(220, 38, 38, 0.1);

      /* Radii */
      --radius:         6px;
      --radius-sm:      4px;
      --radius-lg:      10px;
    }

    * {
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    select option {
      background: var(--bg-raised);
      color: var(--text-primary);
    }

    .hidden {
      display: none !important;
    }

    @keyframes typing-dot {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="background:var(--bg-base); color:var(--text-primary); font-family:'IBM Plex Sans',sans-serif; margin:0; height:100vh; overflow:hidden;">

  <!-- Custom titlebar -->
  <div id="titlebar" style="
    -webkit-app-region: drag;
    height: 36px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    padding-left: 80px;
    justify-content: flex-end;
    flex-shrink: 0;
  ">
    <!-- Window controls only shown on non-macOS -->
    <div id="window-controls" style="-webkit-app-region: no-drag; display:none; gap:8px; padding-right:12px; align-items:center;">
      <button onclick="window.api.minimizeWindow()" title="Minimize" style="
        width:12px; height:12px; border-radius:50%;
        background:#f1c40f; border:none; cursor:pointer; padding:0;
        transition:opacity 0.15s;
      " onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'"></button>
      <button onclick="window.api.maximizeWindow()" title="Maximize" style="
        width:12px; height:12px; border-radius:50%;
        background:#2ecc71; border:none; cursor:pointer; padding:0;
        transition:opacity 0.15s;
      " onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'"></button>
      <button onclick="window.api.closeWindow()" title="Close" style="
        width:12px; height:12px; border-radius:50%;
        background:#e74c3c; border:none; cursor:pointer; padding:0;
        transition:opacity 0.15s;
      " onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'"></button>
    </div>
  </div>

  <!-- Main layout -->
  <div id="app" style="display:flex; height:calc(100vh - 36px);">
    <div id="sidebar-container" style="display:none;"></div>
    <div id="content" style="flex:1; overflow:hidden; position:relative;">
      <div data-view="auth"        class="hidden" style="height:100%;"></div>
      <div data-view="onboarding"  class="hidden" style="height:100%;"></div>
      <div data-view="overview"    class="hidden" style="height:100%;"></div>
      <div data-view="dashboard"   class="hidden" style="height:100%;"></div>
      <div data-view="chat"        class="hidden" style="height:100%;"></div>
      <div data-view="settings"    class="hidden" style="height:100%;"></div>
    </div>
  </div>

  <!-- Scripts loaded in dependency order -->
  <script src="components/toast.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="views/auth.js"></script>
  <script src="views/onboarding.js"></script>
  <script src="views/dashboard.js"></script>
  <script src="views/overview.js"></script>
  <script src="views/chat.js"></script>
  <script src="views/settings.js"></script>
  <script src="app.js"></script>

  <script>
    // Show custom window controls on non-macOS
    const isMac = window.api && window.api.platform === 'darwin'
    if (!isMac) {
      const ctrl = document.getElementById('window-controls')
      if (ctrl) ctrl.style.display = 'flex'
    }
  </script>
</body>
</html>
